name: Static Analysis Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            milestone-4/**/*.md

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: "milestone-4/**/*.md"